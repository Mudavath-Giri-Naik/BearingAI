services:
  - type: web
    name: bearingai-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: bearingai-api-storage
      mountPath: /storage
      sizeGB: 1
    envVars:
      - key: BEARING_AUTH_MODE
        value: local
      - key: BEARING_STORAGE
        value: /storage
      - key: BEARING_ADMIN_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DATASETS_BUCKET
        value: bearing-datasets
      - key: SUPABASE_MODELS_BUCKET
        value: bearing-model-artifacts
      - key: SUPABASE_MODELS_PREFIX
        value: approved

  - type: worker
    name: bearingai-training-worker
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    dockerCommand: python -m app.worker
    envVars:
      - key: BEARING_AUTH_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DATASETS_BUCKET
        value: bearing-datasets
      - key: SUPABASE_MODELS_BUCKET
        value: bearing-model-artifacts
